# ═══════════════════════════════════════════════════════════
# Supabase keepalive — prevents the free-tier 7-day pause.
# Runs 5× per week (Mon, Tue, Thu, Fri, Sat at 08:00 UTC).
# Any API request on the project resets the inactivity timer.
#
# Required repository secrets (Settings → Secrets and variables
# → Actions → New repository secret):
#   SUPABASE_URL       e.g. https://zroofprbvgrccydshyux.supabase.co
#   SUPABASE_ANON_KEY  the publishable key from .env.local
# ═══════════════════════════════════════════════════════════
name: Supabase Keepalive

on:
  schedule:
    - cron: "0 8 * * 1,2,4,5,6"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query stories table (resets inactivity timer)
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/stories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded: HTTP $CODE"
          if [ "$CODE" = "000" ]; then exit 1; fi
